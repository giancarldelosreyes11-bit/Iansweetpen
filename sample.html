<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="stylessample.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">

    </head>
    <header class="header">
    <div class="divHeaderLogos">
        <img src="Images/Logo.png" alt="Ian's Sweet Pen round logo" class="headerLogo">
        <div class="textLogos">
            <h1 class="textHeaderLogo">Ian's Sweet Pen</h1>
            <h4 class="textSubheaderLogo">Gian's Art & Literary Website</h4>
        </div>
    </div>
    </header>

    <body>
    <div class="searchEngine">
        <form onsubmit="submitEvent(event)">
        <div class="search-alignment">
            <button type="submit" class="searchButton"><img src="Images/Search icon.png"></button>
            <input type="search" name="search" class="searchInput" placeholder="Search anything..." oninput="filterItems()" autocomplete="off">
        </div>
        <ul class="resultsContainer">
            <li class="result-item">Home</li>
            <li class="result-item">About</li>
            <li class="result-item">Achievements</li>
            <li class="result-item">Author's profile</li>
            <li class="result-item">Contact</li>
        </ul>
        </form>
    </div>

    </body>

    <script>
        function filterItems(){
            const input = document.querySelector('.searchInput').value.toLowerCase();
            const resultsContainer = document.querySelector('.resultsContainer');
            const items = resultsContainer.querySelectorAll('.result-item');

            if(input){
                resultsContainer.style.display = 'flex';
                    items.forEach(item => {
                        const text = item.textContent.toLowerCase();

                        if(text.includes(input)){
                            item.style.display = 'flex';
                        }else{
                            item.style.display = 'none';
                        }
                });
            }else{
                resultsContainer.style.display = 'none';
            }

        }
    </script>
        

    <script>
        function submitEvent(event){
            event.preventDefault();

            const searchInput = document.querySelector('.searchInput');
            const query = searchInput.value.trim().toLowerCase();

            console.log(query);

            if(query){
                if(query === "home"){
                    window.location.href = 'index.html';
                }else{
                    alert('Sorry, no matching content found for '+query);
                }
            }
        }
    </script>





</html>
